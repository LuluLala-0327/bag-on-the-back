<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연출팀 — 연출 파트 비주얼 레퍼런스</title>
<style>
  :root{
    --bg:#ffffff; --ink:#000000; --mut:#666666; --line:#e2e2e2;
    --soft:#f4f4f4; --chip:#f0f0f0; --accent:#000;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    font-family:"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}
  .topbar{background:#000;height:34px}

  .nav{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;gap:16px;height:64px}
  .brand{font-weight:800;letter-spacing:.14em;font-size:15px;cursor:pointer}
  .nav ul{list-style:none;display:flex;gap:34px;margin-left:auto}
  .nav ul a{font-size:12px;letter-spacing:.16em;font-weight:700;color:#111;text-transform:uppercase;transition:opacity .15s}
  .nav ul a:hover{opacity:.45}

  .hamb{width:40px;height:40px;border:1px solid var(--line);background:#fff;cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0;transition:background .15s}
  .hamb:hover{background:#000}
  .hamb span{display:block;width:18px;height:2px;background:#000;transition:background .15s}
  .hamb:hover span{background:#fff}

  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;visibility:hidden;transition:opacity .22s}
  .drawer-overlay.open{opacity:1;visibility:visible}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:310px;max-width:84vw;background:#fff;z-index:70;
    transform:translateX(-100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;border-right:1px solid #000;box-shadow:2px 0 26px rgba(0,0,0,.18)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:2px solid #000;flex:0 0 auto}
  .drawer-head span{font-weight:800;letter-spacing:.14em;font-size:13px;text-transform:uppercase}
  .drawer-head button{border:none;background:none;font-size:20px;cursor:pointer;line-height:1;color:#000}
  .drawer-list{overflow-y:auto;flex:1 1 auto;padding:6px 0}
  .drawer-list a{display:flex;align-items:baseline;gap:12px;padding:13px 22px;font-size:14px;font-weight:600;
    border-bottom:1px solid var(--line);transition:background .12s,padding-left .12s}
  .drawer-list a:hover{background:#000;color:#fff;padding-left:28px}
  .drawer-list a .dn{font-size:11px;font-weight:800;color:var(--mut);min-width:22px}
  .drawer-list a:hover .dn{color:#bbb}
  .drawer-cat{padding:16px 22px 8px;font-size:11px;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);background:var(--soft)}

  .hero{padding:54px 0 30px}
  .hero h1{font-size:clamp(44px,10vw,132px);line-height:.9;font-weight:800;letter-spacing:-.02em}
  .hero .kr{font-size:clamp(15px,2.6vw,22px);font-weight:700;margin-top:20px;letter-spacing:.02em}
  .hero .lead{max-width:660px;color:#222;font-size:15px;margin-top:16px}

  .searchbar{border-top:1px solid #000;border-bottom:1px solid #000;margin-top:40px}
  .searchbar .wrap{display:flex;align-items:center;gap:16px;padding:0 28px}
  .searchbar input{flex:1;border:none;outline:none;font-size:20px;padding:22px 0;font-family:inherit;background:transparent}
  .searchbar .ic{font-size:20px}
  .searchbar .count{font-size:12px;color:var(--mut);letter-spacing:.08em;white-space:nowrap}

  .overview{padding:56px 0 20px;text-align:center;scroll-margin-top:80px}
  .overview h2{font-size:clamp(30px,6vw,58px);font-weight:800;letter-spacing:-.01em}
  .overview p{color:var(--mut);margin-top:10px;font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;border:1px solid var(--line)}
  .card{border:1px solid var(--line);margin:-1px 0 0 -1px;padding:22px 20px;text-align:left;min-height:132px;
    display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:background .15s;background:#fff}
  .card:hover{background:#000;color:#fff}
  .card .num{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--mut)}
  .card:hover .num{color:#bbb}
  .card .t{font-size:16px;font-weight:800;line-height:1.25}
  .card .arrow{font-size:14px;align-self:flex-end}

  /* big category */
  .ov-cat{margin:46px 0 6px;text-align:left}
  .ov-cat .k{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
  .ov-cat h3{font-size:clamp(19px,3.4vw,28px);font-weight:800;letter-spacing:-.01em;margin-top:6px}
  .ov-cat p{color:var(--mut);font-size:13px;margin-top:6px}
  .cat-band{margin:20px 0 8px;padding:30px 0 22px;border-top:3px solid #000}
  .cat-band .k{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
  .cat-band h2{font-size:clamp(26px,5.4vw,50px);font-weight:800;letter-spacing:-.02em;margin-top:10px}
  .cat-band p{color:#444;font-size:14.5px;margin-top:10px;max-width:780px}

  .content{padding:20px 0 60px}
  .sec{padding:60px 0 10px;border-top:1px solid var(--line);scroll-margin-top:80px}
  .cat-wrap .sec:first-of-type{border-top:none}
  body.focus .hero,body.focus .overview{display:none}
  body.focus .cat-band{display:none}
  body.focus .sec{display:none}
  body.focus .sec.active{display:block;border-top:none;padding-top:34px}
  .sec-head{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
  .sec-no{font-size:13px;font-weight:800;letter-spacing:.12em;border:1px solid #000;padding:4px 10px;color:#000}
  .sec-title{font-size:clamp(26px,5vw,46px);font-weight:800;letter-spacing:-.01em}
  .sec-intro{color:#333;font-size:15px;max-width:760px;margin:6px 0 26px}

  .group{margin:30px 0 8px}
  .group-head{display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:2px;flex-wrap:wrap}
  .group-sub{font-size:17px;font-weight:800;letter-spacing:.01em}
  .group-note{color:var(--mut);font-size:13px}

  .items{list-style:none}
  .item{display:block;padding:22px 4px;border-bottom:1px solid var(--line)}
  .item .name{font-weight:800;font-size:15.5px}
  .item .desc{color:#333;font-size:14.5px;margin-top:5px}
  .ivrow{margin-top:14px}
  .ivlb{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--mut);margin-bottom:9px}
  .ivgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

  /* video / image cards */
  .refs{margin:14px 0 22px;padding:18px;background:var(--soft);border:1px solid var(--line)}
  .refs .lb{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--mut);text-transform:uppercase;margin-bottom:14px}
  .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .vcard{border:1px solid var(--line);background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
  .vcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.14)}
  .vthumb{position:relative;aspect-ratio:16/9;background:#111;display:block}
  .vthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .vthumb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .vplay span{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.72);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:3px;transition:background .15s}
  .vcard:hover .vplay span{background:#000}
  .vcap{padding:9px 11px;font-size:12.5px;font-weight:600;line-height:1.35;border-top:1px solid var(--line)}
  .vcard.playing{grid-column:1/-1;cursor:default}
  .vclose{padding:8px 11px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut);
    border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .vclose button{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;border:1px solid #000;background:#fff;color:#000;padding:5px 10px;cursor:pointer}
  .vclose button:hover{background:#000;color:#fff}
  .vclose a{text-decoration:underline;color:var(--mut)}
  .imgcard .vthumb{background:#eee}
  .imgcard .vext-badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;
    font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 7px}
  .vext{display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 12px;font-size:13px;font-weight:700;aspect-ratio:16/9}
  .vext::after{content:"↗";margin-left:6px;opacity:.55}

  /* color chips */
  .chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:6px}
  .chip{border:1px solid var(--line);background:#fff;overflow:hidden}
  .chip .sw{height:76px;width:100%;display:block}
  .chip-cap{padding:8px 10px;font-size:12px;line-height:1.45}
  .chip-cap b{display:block;font-weight:800;letter-spacing:.03em;font-family:"Helvetica Neue",Arial,monospace}
  .chip-cap span{color:var(--mut)}

  /* reference table (이미지 + 내용) */
  .reftable{width:100%;border-collapse:collapse;margin-top:12px;border:1px solid var(--line)}
  .reftable td{border:1px solid var(--line);vertical-align:top;padding:0}
  .rt-img{width:44%}
  .rt-img a{display:block;height:100%}
  .rt-img img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block;cursor:zoom-in}
  .rt-txt{padding:18px 20px}
  .rt-name{font-weight:800;font-size:16px;margin-bottom:10px}
  .rt-desc{color:#333;font-size:14px;line-height:1.78;white-space:pre-line}
  @media(max-width:640px){ .reftable,.reftable tbody,.reftable tr,.reftable td{display:block;width:100%}
    .rt-img{width:100%} .rt-img img{min-height:0;aspect-ratio:16/10} }
  .imgslot{display:flex;align-items:center;justify-content:center;min-height:210px;height:100%;
    background:repeating-linear-gradient(45deg,#f4f4f4,#f4f4f4 10px,#ececec 10px,#ececec 20px);
    color:#999;font-size:12px;font-weight:700;text-align:center;padding:16px;line-height:1.6}

  /* lightbox (클릭 확대) */
  .lightbox{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:94vw;max-height:92vh;object-fit:contain;box-shadow:0 10px 44px rgba(0,0,0,.55)}
  .lightbox .lb-cap{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#ddd;font-size:13px;font-weight:600}
  .lb-close{position:fixed;top:18px;right:22px;color:#fff;font-size:24px;cursor:pointer;width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;border:1px solid #666;border-radius:50%}
  .lb-close:hover{background:#fff;color:#000}

  footer{border-top:1px solid #000;background:#000;color:#fff;padding:48px 0}
  footer .big{font-size:clamp(28px,7vw,64px);font-weight:800;letter-spacing:-.01em}
  footer .sub{color:#999;font-size:13px;margin-top:16px;max-width:620px}

  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){.nav ul{display:none}}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar"></div>

<nav class="nav">
  <div class="wrap">
    <button class="hamb" id="hambBtn" aria-label="섹션 메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
    <div class="brand">연출팀</div>
    <ul id="navlist">
      <li><a href="#overview">SECTIONS</a></li>
      <li><a href="#s1">컬러칩</a></li>
      <li><a href="#s2">키샷</a></li>
      <li><a href="#s3">나무</a></li>
    </ul>
  </div>
</nav>

<div class="drawer-overlay" id="drawerOv"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="섹션 목록">
  <div class="drawer-head"><span>전체 섹션</span><button id="drawerClose" aria-label="닫기">✕</button></div>
  <nav class="drawer-list" id="drawerList"></nav>
</aside>

<header class="hero">
  <div class="wrap">
    <h1>연출팀</h1>
    <div class="kr">연출 파트 비주얼 레퍼런스</div>
    <p class="lead" id="leadTxt"></p>
  </div>
</header>

<div class="searchbar">
  <div class="wrap">
    <span class="ic">⌕</span>
    <input id="search" type="text" placeholder="검색 — 예: 컬러칩, 키샷, 나무, 이끼…" autocomplete="off">
    <span class="count" id="count"></span>
  </div>
</div>

<main>
  <section class="overview" id="overview">
    <div class="wrap"><h2 id="ovTitle"></h2><p id="ovDesc"></p><div id="cards"></div></div>
  </section>
  <div class="content wrap" id="content"></div>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true">
  <span class="lb-close" id="lbClose" aria-label="닫기">✕</span>
  <img id="lbImg" src="" alt=""><div class="lb-cap" id="lbCap"></div>
</div>

<footer>
  <div class="wrap"><div class="big" id="ftBig"></div><p class="sub" id="ftSub"></p></div>
</footer>

<script>
function __bootRefPage(){
  var D = window.REF_DATA;
  var CATS = (D.categories && D.categories.length) ? D.categories : [{id:null,title:null}];
  function sectionsOf(catId){ return D.sections.filter(function(s){ return (s.cat||null)===catId; }); }

  document.getElementById('leadTxt').textContent = D.meta.lead||'';
  document.getElementById('ovTitle').textContent = D.meta.overviewTitle || (D.sections.length+' SECTIONS');
  document.getElementById('ovDesc').textContent = D.meta.overviewDesc || '';
  if(D.footer){ document.getElementById('ftBig').innerHTML=D.footer.big||''; document.getElementById('ftSub').textContent=D.footer.sub||''; }

  function ytId(u){ var m=u.match(/[?&]v=([^&]+)/)||u.match(/youtu\.be\/([^?&]+)/)||u.match(/embed\/([^?&]+)/); return m?m[1]:null; }
  function esc(t){ var d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; }
  function pad(n){ return String(n).length<2?'0'+n:''+n; }
  var ONERR="this.onerror=null;var p=document.createElement('div');p.className='imgslot';p.textContent='이미지 대기: '+this.getAttribute('src');this.parentNode.replaceChild(p,this);";

  /* ---- overview cards ---- */
  var cardsHost=document.getElementById('cards');
  CATS.forEach(function(c){
    if(c.title){ var lab=document.createElement('div'); lab.className='ov-cat';
      lab.innerHTML='<span class="k">CATEGORY</span><h3>'+esc(c.title)+'</h3>'+(c.desc?'<p>'+esc(c.desc)+'</p>':'');
      cardsHost.appendChild(lab); }
    var grid=document.createElement('div'); grid.className='cards';
    sectionsOf(c.id||null).forEach(function(s){
      var a=document.createElement('a'); a.className='card'; a.href='#s'+s.n;
      a.innerHTML='<div class="num">SECTION '+pad(s.n)+'</div><div class="t">'+esc(s.title)+'</div><div class="arrow">↗</div>';
      grid.appendChild(a);
    });
    cardsHost.appendChild(grid);
  });

  /* ---- viewers ---- */
  function videoCard(r){
    var id=r.id||ytId(r.url);
    if(id){
      return '<div class="vcard" data-yt="'+id+'" data-s="'+(r.start||0)+'" data-t="'+esc(r.label)+'" data-u="'+esc(r.url)+'">'+
        '<div class="vthumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg" alt="'+esc(r.label)+'" '+
        'onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg\'"><div class="vplay"><span>&#9654;</span></div></div>'+
        '<div class="vcap">'+esc(r.label)+'</div></div>';
    }
    return '<a class="vcard" href="'+esc(r.url)+'" target="_blank" rel="noopener" style="color:#000">'+
      '<div class="vext">'+esc(r.label)+'</div><div class="vcap">링크 · 새 탭에서 열기</div></a>';
  }
  function imageCard(im){
    return '<div class="vcard imgcard" data-full="'+esc(im.src)+'" data-cap="'+esc(im.label||'')+'" style="cursor:zoom-in">'+
      '<div class="vthumb"><img loading="lazy" src="'+esc(im.src)+'" alt="'+esc(im.label)+'" onerror="'+ONERR+'">'+
      '<span class="vext-badge">크게 보기 ⤢</span></div><div class="vcap">'+esc(im.label||'')+'</div></div>';
  }
  function chipCard(ch){
    return '<div class="chip"><span class="sw" style="background:'+esc(ch.hex)+'"></span>'+
      '<div class="chip-cap"><b>'+esc(ch.hex)+'</b>'+(ch.name?'<span>'+esc(ch.name)+'</span>':'')+'</div></div>';
  }
  function block(label, gridCls, cards){
    if(!cards.length) return '';
    return '<div class="ivrow"><span class="ivlb">'+label+'</span><div class="'+gridCls+'">'+cards.join('')+'</div></div>';
  }
  function itemViewer(it){
    var out='';
    out+=block('▶ 영상','ivgrid',(it.refs||[]).map(videoCard));
    out+=block('▤ 이미지','vgrid',(it.imgs||[]).map(imageCard));
    out+=block('◧ 컬러칩','chipgrid',(it.chips||[]).map(chipCard));
    return out;
  }
  function groupFallback(g){
    var out='';
    if((g.refs&&g.refs.length)||(g.imgs&&g.imgs.length)||(g.chips&&g.chips.length)){
      out+='<div class="refs"><div class="lb">레퍼런스</div>';
      if(g.refs&&g.refs.length) out+='<div class="vgrid">'+g.refs.map(videoCard).join('')+'</div>';
      if(g.imgs&&g.imgs.length) out+='<div class="vgrid" style="margin-top:12px">'+g.imgs.map(imageCard).join('')+'</div>';
      if(g.chips&&g.chips.length) out+='<div class="chipgrid" style="margin-top:12px">'+g.chips.map(chipCard).join('')+'</div>';
      out+='</div>';
    }
    return out;
  }

  /* ---- render sections ---- */
  var content=document.getElementById('content');
  CATS.forEach(function(c){
   var wrap=document.createElement('div'); wrap.className='cat-wrap'; wrap.setAttribute('data-cat',c.id||'');
   if(c.title){ var band=document.createElement('div'); band.className='cat-band';
     band.innerHTML='<span class="k">CATEGORY</span><h2>'+esc(c.title)+'</h2>'+(c.desc?'<p>'+esc(c.desc)+'</p>':''); wrap.appendChild(band); }
   sectionsOf(c.id||null).forEach(function(s){
    var sec=document.createElement('section'); sec.className='sec'; sec.id='s'+s.n;
    var html='<div class="sec-head"><span class="sec-no">'+pad(s.n)+'</span><h3 class="sec-title">'+esc(s.title)+'</h3></div>';
    if(s.intro) html+='<p class="sec-intro">'+esc(s.intro)+'</p>';
    (s.groups||[]).forEach(function(g){
      html+='<div class="group"><div class="group-head"><span class="group-sub">'+esc(g.sub)+'</span>'+
        (g.note?'<span class="group-note">'+esc(g.note)+'</span>':'')+'</div>';
      if(g.layout==='table' && g.items && g.items.length){
        html+='<table class="reftable"><tbody>';
        g.items.forEach(function(it){
          var im=(it.imgs&&it.imgs[0])||null;
          var cell = im ? '<a data-full="'+esc(im.src)+'" data-cap="'+esc(it.name)+'"><img loading="lazy" src="'+esc(im.src)+'" alt="'+esc(it.name)+'" onerror="'+ONERR+'"></a>'
                        : '<div class="imgslot">이미지 없음</div>';
          html+='<tr><td class="rt-img">'+cell+'</td><td class="rt-txt">'+
            '<div class="rt-name">'+esc(it.name)+'</div><div class="rt-desc">'+esc(it.desc||'')+'</div></td></tr>';
        });
        html+='</tbody></table>';
      } else if(g.items&&g.items.length){
        html+='<ul class="items">';
        g.items.forEach(function(it){
          html+='<li class="item" data-name="'+esc(it.name)+'" data-desc="'+esc(it.desc||'')+'">'+
            '<div class="name">'+esc(it.name)+'</div>'+(it.desc?'<div class="desc">'+esc(it.desc)+'</div>':'')+
            itemViewer(it)+'</li>';
        });
        html+='</ul>';
      }
      html+=groupFallback(g)+'</div>';
    });
    sec.innerHTML=html; wrap.appendChild(sec);
   });
   content.appendChild(wrap);
  });

  /* ---- inline video play ---- */
  function playCard(card){
    if(card.classList.contains('playing')) return;
    var id=card.getAttribute('data-yt'),title=card.getAttribute('data-t'),url=card.getAttribute('data-u'),
        start=parseInt(card.getAttribute('data-s'),10)||0;
    card.classList.add('playing');
    card.innerHTML='<div class="vthumb"><iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0'+
      (start?('&start='+start):'')+'" title="'+esc(title)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>'+
      '<div class="vcap">'+esc(title)+'</div><div class="vclose"><a href="'+esc(url)+'" target="_blank" rel="noopener">유튜브에서 열기 ↗</a>'+
      '<button type="button" class="stopBtn">✕ 닫기</button></div>';
  }
  function stopCard(card){
    var id=card.getAttribute('data-yt'),title=card.getAttribute('data-t');
    card.classList.remove('playing');
    card.innerHTML='<div class="vthumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+id+'/mqdefault.jpg" alt="'+esc(title)+'" '+
      'onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg\'"><div class="vplay"><span>&#9654;</span></div></div><div class="vcap">'+esc(title)+'</div>';
  }
  content.addEventListener('click',function(e){
    var stop=e.target.closest&&e.target.closest('.stopBtn');
    if(stop){ e.preventDefault(); stopCard(stop.closest('.vcard')); return; }
    var card=e.target.closest&&e.target.closest('.vcard[data-yt]');
    if(card) playCard(card);
  });

  /* ---- search ---- */
  var search=document.getElementById('search'),count=document.getElementById('count');
  var items=Array.prototype.slice.call(document.querySelectorAll('.item'));
  var groups=Array.prototype.slice.call(document.querySelectorAll('.group'));
  var secs=Array.prototype.slice.call(document.querySelectorAll('.sec'));
  var catwraps=Array.prototype.slice.call(document.querySelectorAll('.cat-wrap'));
  var total=items.length;
  function setCount(n){ count.textContent=n+' / '+total+' 항목'; }
  setCount(total);

  function clearFilter(){ search.value='';
    items.forEach(function(i){i.style.display='';}); groups.forEach(function(g){g.style.display='';});
    secs.forEach(function(s){s.style.display='';}); catwraps.forEach(function(w){w.style.display='';}); setCount(total); }
  function goSection(n){ clearFilter(); document.body.classList.add('focus');
    secs.forEach(function(s){s.classList.toggle('active',s.id==='s'+n);}); window.scrollTo(0,0); }
  function showAll(){ document.body.classList.remove('focus'); secs.forEach(function(s){s.classList.remove('active');}); window.scrollTo(0,0); }

  search.addEventListener('input',function(){
    if(document.body.classList.contains('focus')){ document.body.classList.remove('focus'); secs.forEach(function(s){s.classList.remove('active');}); }
    var q=search.value.trim().toLowerCase(),shown=0;
    items.forEach(function(it){ var hit=!q||(it.dataset.name+' '+it.dataset.desc).toLowerCase().indexOf(q)>=0; it.style.display=hit?'':'none'; if(hit)shown++; });
    groups.forEach(function(g){ var any=Array.prototype.some.call(g.querySelectorAll('.item'),function(i){return i.style.display!=='none';});
      var hasOnlyFallback=!g.querySelector('.item'); g.style.display=(any||hasOnlyFallback&&!q)?'':'none'; });
    secs.forEach(function(s){ var any=Array.prototype.some.call(s.querySelectorAll('.group'),function(g){return g.style.display!=='none';}); s.style.display=any?'':'none'; });
    catwraps.forEach(function(w){ var any=Array.prototype.some.call(w.querySelectorAll('.sec'),function(s){return s.style.display!=='none';}); w.style.display=any?'':'none'; });
    setCount(shown);
  });

  /* ---- drawer ---- */
  var drawer=document.getElementById('drawer'),drawerOv=document.getElementById('drawerOv'),
      drawerList=document.getElementById('drawerList'),hambBtn=document.getElementById('hambBtn');
  CATS.forEach(function(c){
    if(c.title){ var h=document.createElement('div'); h.className='drawer-cat'; h.textContent=c.title; drawerList.appendChild(h); }
    sectionsOf(c.id||null).forEach(function(s){ var a=document.createElement('a'); a.href='#s'+s.n;
      a.innerHTML='<span class="dn">'+pad(s.n)+'</span><span>'+esc(s.title)+'</span>'; drawerList.appendChild(a); });
  });
  function openDrawer(){ drawer.classList.add('open'); drawerOv.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeDrawer(){ drawer.classList.remove('open'); drawerOv.classList.remove('open'); document.body.style.overflow=''; }
  hambBtn.addEventListener('click',openDrawer);
  document.getElementById('drawerClose').addEventListener('click',closeDrawer);
  drawerOv.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrawer(); });

  /* ---- nav ---- */
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    var href=a.getAttribute('href');
    if(href==='#overview'){ e.preventDefault(); showAll(); closeDrawer(); return; }
    var m=href.match(/^#s(\d+)$/); if(m){ e.preventDefault(); goSection(+m[1]); closeDrawer(); }
  });
  document.querySelector('.brand').addEventListener('click',showAll);

  /* ---- lightbox (이미지 클릭 확대) ---- */
  var lb=document.getElementById('lightbox'),lbImg=document.getElementById('lbImg'),lbCap=document.getElementById('lbCap');
  function openLB(src,cap){ lbImg.src=src; lbCap.textContent=cap||''; lb.classList.add('open'); document.body.style.overflow='hidden'; }
  function closeLB(){ lb.classList.remove('open'); lbImg.src=''; document.body.style.overflow=''; }
  document.addEventListener('click',function(e){
    var t=e.target.closest&&e.target.closest('[data-full]'); if(!t) return;
    e.preventDefault(); openLB(t.getAttribute('data-full'), t.getAttribute('data-cap'));
  });
  document.getElementById('lbClose').addEventListener('click',closeLB);
  lb.addEventListener('click',function(e){ if(e.target===lb) closeLB(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeLB(); });
}

(function(){
  var s=document.createElement('script');
  s.src='data.js?t='+Date.now();
  s.onload=__bootRefPage;
  s.onerror=function(){ document.getElementById('content').innerHTML='<p style="padding:40px 4px">데이터를 불러오지 못했습니다. 새로고침 해주세요.</p>'; };
  document.head.appendChild(s);
})();
</script>
